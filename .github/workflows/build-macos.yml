name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build macOS Binaries (Universal, Intel, Apple Silicon)
    # Xcode 26 requis (objectVersion 77 + SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor)
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build Universal Binary (x86_64 + arm64)
        run: |
          xcodebuild -scheme iCloudPhoto2Nextcloud \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedDataUniversal \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc \
            build/DerivedDataUniversal/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/artifacts/iCloudPhoto2Nextcloud-Universal.zip

      - name: Build Intel Binary (x86_64)
        run: |
          xcodebuild -scheme iCloudPhoto2Nextcloud \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedDataIntel \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          ditto -c -k --sequesterRsrc \
            build/DerivedDataIntel/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/artifacts/iCloudPhoto2Nextcloud-macOS-Intel-x86_64.zip

      - name: Build Apple Silicon Binary (arm64)
        run: |
          xcodebuild -scheme iCloudPhoto2Nextcloud \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedDataARM64 \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          ditto -c -k --sequesterRsrc \
            build/DerivedDataARM64/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/artifacts/iCloudPhoto2Nextcloud-macOS-AppleSilicon-arm64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-Builds
          path: build/artifacts/*.zip
          if-no-files-found: error

      # Publie une release par build : chaque push sur main crée une nouvelle
      # release (tag ci-<sha>) qui devient "Latest" → liens stables
      # /releases/latest/download/<zip> dans le README.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: Build ${{ github.sha }}
          body: |
            Build automatique du commit `${{ github.sha }}` — binaires **non signés**.

            | Fichier | Architecture |
            |---|---|
            | `iCloudPhoto2Nextcloud-Universal.zip` | Intel + Apple Silicon |
            | `iCloudPhoto2Nextcloud-macOS-Intel-x86_64.zip` | Intel |
            | `iCloudPhoto2Nextcloud-macOS-AppleSilicon-arm64.zip` | Apple Silicon |

            [Détail du workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: build/artifacts/*.zip
          fail_on_unmatched_files: false
          make_latest: true
