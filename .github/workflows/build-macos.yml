name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build macOS Binaries (Universal, Intel, Apple Silicon)
    # Xcode 26 requis (objectVersion 77 + SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor)
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet requis pour git rev-list --count (numéro de build)
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build Universal Binary (x86_64 + arm64)
        run: |
          xcodebuild -scheme iCloudPhoto2Nextcloud \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedDataUniversal \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build Intel Binary (x86_64)
        run: |
          xcodebuild -scheme iCloudPhoto2Nextcloud \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedDataIntel \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build Apple Silicon Binary (arm64)
        run: |
          xcodebuild -scheme iCloudPhoto2Nextcloud \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedDataARM64 \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # Estampille le numéro de build incrémental (CFBundleVersion = nombre de
      # commits, monte automatiquement à chaque push) et le tag ci-<sha>
      # (clé CIBuildTag) pour que l'auto-update sache quelle release l'app exécute.
      - name: Stamp build tag and package zips
        run: |
          set -e
          BUILD_NUMBER=$(git rev-list --count HEAD)
          for app in \
            build/DerivedDataUniversal/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/DerivedDataIntel/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/DerivedDataARM64/Build/Products/Release/iCloudPhoto2Nextcloud.app; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CIBuildTag string ci-${{ github.sha }}" "$app/Contents/Info.plist"
          done

          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedDataUniversal/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/artifacts/iCloudPhoto2Nextcloud-Universal.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedDataIntel/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/artifacts/iCloudPhoto2Nextcloud-macOS-Intel-x86_64.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedDataARM64/Build/Products/Release/iCloudPhoto2Nextcloud.app \
            build/artifacts/iCloudPhoto2Nextcloud-macOS-AppleSilicon-arm64.zip

      # Corps de la release : table markdown avec les empreintes SHA-256
      # (lues par l'auto-update pour vérifier les zips au téléchargement).
      - name: Prepare release notes
        run: |
          {
            echo "Build automatique du commit \`${{ github.sha }}\` — binaires **non signés**."
            echo
            echo "| Fichier | Architecture | Empreinte SHA-256 |"
            echo "|---|---|---|"
            shasum -a 256 build/artifacts/*.zip | while read -r hash file; do
              name=$(basename "$file")
              case "$name" in
                *Universal*) arch="Intel + Apple Silicon" ;;
                *AppleSilicon*) arch="Apple Silicon" ;;
                *) arch="Intel" ;;
              esac
              echo "| $name | $arch | $hash |"
            done
            echo
            echo "[Détail du workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > build/release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-Builds
          path: build/artifacts/*.zip
          if-no-files-found: error

      # Publie une release par build : chaque push sur main crée une nouvelle
      # release (tag ci-<sha>) qui devient "Latest" → liens stables
      # /releases/latest/download/<zip> dans le README et l'auto-update.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: Build ${{ github.sha }}
          body_path: build/release_notes.md
          files: build/artifacts/*.zip
          fail_on_unmatched_files: false
          make_latest: true